name: Release
# A version change merged into main builds and publishes its installer. Tags and
# manual dispatch remain supported; existing releases are never overwritten.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (par exemple v0.2.1), déjà poussé'
        required: true
        type: string
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.sha }}
      bundle: false
  windows:
    needs: checks
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Resolve and verify the release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $nativeVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $nativeVersion) { throw 'Versions incohérentes.' }
          if ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = "v$version"
          } else { $tag = $env:RELEASE_TAG }
          if ($tag -ne "v$version") { throw 'Le tag ne correspond pas à la version du code.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Cette version est déjà publiée ; aucune réécriture autorisée.' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          exit 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The installer is signed for the in-app update (src-tauri/src/update.rs): the key lives in the
      # repository's secrets, its public half in tauri.conf.json. No key, no release.
      - name: Build and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Secret TAURI_SIGNING_PRIVATE_KEY absent : installateur non signé, release refusée.' }
          npm run tauri -- build --bundles nsis --config src-tauri/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Build de l’installateur impossible." }
      - name: Publish the installer and its SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Aucun installateur NSIS produit.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii SHA256SUMS.txt
          # The first section of docs/RELEASE-NOTES.md is this version's note.
          $lines = Get-Content docs/RELEASE-NOTES.md
          $starts = @(); for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -like '# *') { $starts += $i } }
          $end = if ($starts.Count -gt 1) { $starts[1] - 1 } else { $lines.Count - 1 }
          $lines[$starts[0]..$end] | Set-Content -Encoding utf8 release-notes.md
          Add-Content release-notes.md ""
          Add-Content release-notes.md "SHA-256 de l’installateur : ``$hash``"
          # What the installed apps read to update themselves (releases/latest/download/latest.json).
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "Signature de l’installateur absente." }
          [ordered]@{
            version = $tag.TrimStart('v')
            notes = (Get-Content release-notes.md -Raw)
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{
              signature = (Get-Content $sig -Raw).Trim()
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)"
            } }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM latest.json
          if ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Création du tag impossible.' }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Publication du tag impossible.' }
          }
          gh release create $tag $exe.FullName SHA256SUMS.txt latest.json --title "Overtype $tag" --notes-file release-notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Publication de la release impossible.' }
