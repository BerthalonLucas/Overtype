name: flowtranslate

x-engine: &engine
  image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
  ipc: host
  environment: &engine-environment
    CUDA_DEVICE_ORDER: PCI_BUS_ID
    # vLLM 0.28 V2 requires UVA, unavailable under WSL2.
    VLLM_USE_V2_MODEL_RUNNER: "0"
    VLLM_LOGGING_LEVEL: WARNING
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
    VLLM_NO_USAGE_STATS: "1"
  volumes:
    - model-cache:/root/.cache/huggingface
    - compile-cache:/root/.cache/vllm
  restart: "no"
  healthcheck:
    test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
    interval: 15s
    timeout: 8s
    start_period: 600s
    retries: 4
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "2"

services:
  fast:
    <<: *engine
    profiles: [fast]
    environment:
      <<: *engine-environment
      CUDA_VISIBLE_DEVICES: "${FAST_GPU:-1}"
    ports: ["127.0.0.1:${FAST_PORT:-8001}:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - tencent/Hy-MT2-1.8B
      - --revision
      - 9a341cd1b679d3efd23b46e847b01745a71ed792
      - --served-model-name
      - flowtranslate-fast
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "10"
      - --gpu-memory-utilization
      - "${FAST_GPU_MEMORY:-0.45}"
      - --no-enable-flashinfer-autotune
      - --no-enable-log-requests
      - --max-log-len
      - "0"
      - --uvicorn-log-level
      - warning
  quality:
    <<: *engine
    profiles: [quality]
    environment:
      <<: *engine-environment
      CUDA_VISIBLE_DEVICES: "${QUALITY_GPU:-0}"
    ports: ["127.0.0.1:${QUALITY_PORT:-8002}:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - tencent/Hy-MT2-7B-FP8
      - --revision
      - 883d09eb21d9be92058556cd0a4016d8a648c7db
      - --served-model-name
      - flowtranslate-quality
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "10"
      - --gpu-memory-utilization
      - "${QUALITY_GPU_MEMORY:-0.80}"
      - --no-enable-flashinfer-autotune
      - --no-enable-log-requests
      - --max-log-len
      - "0"
      - --uvicorn-log-level
      - warning

  general:
    <<: *engine
    profiles: [general]
    environment:
      <<: *engine-environment
      CUDA_VISIBLE_DEVICES: "${GENERAL_GPU:-0}"
    ports: ["127.0.0.1:${GENERAL_PORT:-8003}:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - google/gemma-4-12B-it-qat-w4a16-ct
      - --revision
      - 1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee
      - --served-model-name
      - flowtranslate-general
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "4"
      - --limit-mm-per-prompt
      - '{"image": 0, "audio": 0}'
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "${GENERAL_GPU_MEMORY:-0.85}"
      - --speculative-config
      - '{"model": "google/gemma-4-12B-it-qat-q4_0-unquantized-assistant", "revision": "18934064dd4c5c6cc3621f6381e7d377fc8cb7bd", "num_speculative_tokens": 4}'
      - --no-enable-flashinfer-autotune
      - --no-enable-log-requests
      - --max-log-len
      - "0"
      - --uvicorn-log-level
      - warning

volumes:
  model-cache:
  compile-cache:
