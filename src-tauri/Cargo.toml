[package]
name = "flowtranslate"
version = "0.5.1"
description = "FlowTranslate Windows desktop host"
authors = ["FlowTranslate contributors"]
edition = "2021"
rust-version = "1.91"

[lib]
name = "flowtranslate_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "FlowTranslate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "native-tls", "stream"] }
native-tls = "0.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-util = "0.7.16"
uiautomation = { version = "0.25.1", features = ["clipboard", "event"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
